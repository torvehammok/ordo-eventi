syntax = "proto3";
package io.github.torvehammok.ordoeventi.proto;

option java_multiple_files = true;

import "common/Money.proto";
import "common/Address.proto";
import "purchases/Product.proto";
import "purchases/Offer.proto";
import "purchases/Payment.proto";

message PurchaseProto {
  string purchaseId = 1;
  string customerId = 2;
  ProductProto product = 3;
  OfferProto offer = 4;
  io.github.torvehammok.proto.common.MoneyProto net = 5;
  io.github.torvehammok.proto.common.MoneyProto tax = 6;
  io.github.torvehammok.proto.common.MoneyProto gross = 7;
  io.github.torvehammok.proto.common.AddressProto billingAddress = 8;
  io.github.torvehammok.ordoeventi.proto.PaymentProto payment = 9;
}
