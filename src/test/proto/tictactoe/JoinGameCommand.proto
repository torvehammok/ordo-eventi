syntax = "proto3";

package io.github.torvehammok.proto.tictactoe;

option java_multiple_files = true;

import "gaming-common/Player.proto";

// Command to join an existing game
message JoinGameCommand {
  string game_id = 1;
  io.github.torvehammok.proto.gaming.PlayerProto player = 2;
  optional string invitation_code = 3; // Required for private games
}
