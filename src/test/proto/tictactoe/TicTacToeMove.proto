syntax = "proto3";

package io.github.torvehammok.proto.tictactoe;

option java_multiple_files = true;

import "gaming-common/Player.proto";

// Represents a single move in a tic-tac-toe game
message TicTacToeMove {
  string game_id = 1;
  io.github.torvehammok.proto.gaming.PlayerProto player = 2;
  int32 row = 3;      // 0-2
  int32 column = 4;   // 0-2
  int64 timestamp = 5; // Unix timestamp in milliseconds
}
